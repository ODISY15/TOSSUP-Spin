[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/themes"
  to = "/.netlify/functions/themes"
  status = 200

[[redirects]]
  from = "/api/suggestions"
  to = "/.netlify/functions/suggestions"
  status = 200

[[redirects]]
  from = "/api/option-collections"
  to = "/.netlify/functions/option-collections"
  status = 200

[[redirects]]
  from = "/api/result-messages"
  to = "/.netlify/functions/result-messages"
  status = 200

[[redirects]]
  from = "/api/presets"
  to = "/.netlify/functions/presets"
  status = 200

[[redirects]]
  from = "/api/newsletter"
  to = "/.netlify/functions/newsletter"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
